# Copy into your app repo as .github/workflows/security-sbom.yml
# Replace OWNER/mega-cicd-security and prefer a commit SHA instead of @main.
name: Security — sbom

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  pull-requests: read
  packages: read

concurrency:
  group: security-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    uses: OWNER/mega-cicd-security/.github/workflows/reusable-sbom.yml@382771c0827f92f52418cbc6fb0d78ed9b40ec4a # pin to commit SHA; bump when upgrading
    with:
      selection-mode: detected
      fail-on-severity: HIGH
      # Set enable-*: false to disable individual tools in the reusable workflow.

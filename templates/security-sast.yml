# Copy into your app repo as .github/workflows/security-sast.yml
# Replace OWNER/scankit and prefer a commit SHA instead of @main.
name: Security — sast

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  pull-requests: read
  packages: read

concurrency:
  group: security-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    uses: OWNER/scankit/.github/workflows/reusable-sast.yml@de0865046614b990bf4c242d38a5a4a107df2bbc # pin to commit SHA; bump when upgrading
    with:
      selection-mode: detected
      fail-on-severity: HIGH
      # scan-scope defaults to full for category-only entrypoints;
      # use reusable-security-full for PR diff scoping (scan-scope: auto).
      # Set enable-*: false to disable individual tools in the reusable workflow.

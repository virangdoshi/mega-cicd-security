# Copy into your app repo as .github/workflows/security-iac.yml
# Replace OWNER/scankit and prefer a commit SHA instead of @main.
name: Security — iac

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  pull-requests: read
  packages: read

concurrency:
  group: security-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    uses: OWNER/scankit/.github/workflows/reusable-iac.yml@5c116447f13eea8bb8c9ee254464ce0f981eda48 # pin to commit SHA; bump when upgrading
    with:
      selection-mode: detected
      fail-on-severity: HIGH
      # scan-scope defaults to full for category-only entrypoints;
      # use reusable-security-full for PR diff scoping (scan-scope: auto).
      # Set enable-*: false to disable individual tools in the reusable workflow.

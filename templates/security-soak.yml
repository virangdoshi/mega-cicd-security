# Soak / intentional-vuln repos — report without failing the workflow.
name: Security — soak

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read
  id-token: write
  packages: read

concurrency:
  group: security-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: OWNER/scankit/.github/workflows/reusable-security-full.yml@de0865046614b990bf4c242d38a5a4a107df2bbc
    with:
      profile: soak
      selection-mode: detected
      fail-on-severity: NONE
      pr-report-mode: comment
      results-publish-mode: none

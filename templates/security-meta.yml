# Copy into your app repo as .github/workflows/security-meta.yml
# Replace OWNER/mega-cicd-security and prefer a commit SHA instead of @main.
name: Security — meta

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  pull-requests: read
  packages: read

concurrency:
  group: security-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    uses: OWNER/mega-cicd-security/.github/workflows/reusable-meta.yml@main
    with:
      selection-mode: detected
      fail-on-severity: HIGH
      # Set enable-*: false to disable individual tools in the reusable workflow.

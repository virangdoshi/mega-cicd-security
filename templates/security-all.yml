# Copy into your app repo as .github/workflows/security-all.yml
# Replace OWNER/scankit and prefer a commit SHA instead of @main.
# Enable Code Scanning in the repo settings so SARIF uploads appear in the Security tab.
# Caller permissions must meet reusable-security-full's ceiling (contents:write + pull-requests:write)
# or the run fails at startup with no useful error.
name: Security — all

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read
  id-token: write
  pull-requests: write
  packages: read

concurrency:
  group: security-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: OWNER/scankit/.github/workflows/reusable-security-full.yml@5c116447f13eea8bb8c9ee254464ce0f981eda48 # pin to commit SHA; bump when upgrading
    with:
      selection-mode: detected
      fail-on-severity: HIGH
      results-publish-mode: none
      # enable-scancode: false
      # image: ""
      # dockerfile: Dockerfile

# Copy into your app repo as .github/workflows/security-all.yml
# Replace OWNER/scankit and prefer a commit SHA instead of @main.
# Enable Code Scanning in the repo settings so SARIF uploads appear in the Security tab.
# Caller permissions must meet reusable-security-full's ceiling
# (contents:write + pull-requests:write + security-events:write) or the run
# fails at startup with no useful error — even when publish mode is none.
name: Security — all

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read
  id-token: write
  packages: read

concurrency:
  group: security-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: OWNER/scankit/.github/workflows/reusable-security-full.yml@de0865046614b990bf4c242d38a5a4a107df2bbc # pin to commit SHA; bump when upgrading
    with:
      selection-mode: detected
      fail-on-severity: HIGH
      results-publish-mode: none
      # pr-report-mode: both  # sticky PR comment + annotations (default on pull_request)
      # scan-scope: auto  # diff on PRs, full on push/dispatch
      # Docker/compile of PR code is off by default:
      # enable-image-build: true
      # enable-code-build: true
      # enable-scancode: false
      # image: ""
      # dockerfile: Dockerfile

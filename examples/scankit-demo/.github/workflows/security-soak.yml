name: Security (soak)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read
  id-token: write
  packages: read

jobs:
  security:
    uses: virangdoshi/scankit/.github/workflows/reusable-security-full.yml@c7197e7783122e34257224c14b355c92a9d1450e
    with:
      profile: soak
      selection-mode: detected
      fail-on-severity: NONE
      pr-report-mode: both
      results-publish-mode: none

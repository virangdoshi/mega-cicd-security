name: resolve-settings
description: Merge .scankit.yml, profile, and workflow inputs into effective settings
inputs:
  profile:
    default: standard
  config-path:
    default: ""
  scan-scope:
    default: auto
  fail-on-severity:
    default: HIGH
  pr-report-mode:
    default: both
  enable-dast:
    default: "false"
  dast-url:
    default: ""
outputs:
  scan_scope:
    value: ${{ steps.run.outputs.scan_scope }}
  fail_on_severity:
    value: ${{ steps.run.outputs.fail_on_severity }}
  pr_report_mode:
    value: ${{ steps.run.outputs.pr_report_mode }}
  enable_dast:
    value: ${{ steps.run.outputs.enable_dast }}
  dast_url:
    value: ${{ steps.run.outputs.dast_url }}
  run_secrets:
    value: ${{ steps.run.outputs.run_secrets }}
  run_sca:
    value: ${{ steps.run.outputs.run_sca }}
  run_sast:
    value: ${{ steps.run.outputs.run_sast }}
  run_container:
    value: ${{ steps.run.outputs.run_container }}
  run_iac:
    value: ${{ steps.run.outputs.run_iac }}
  run_sbom:
    value: ${{ steps.run.outputs.run_sbom }}
  run_supply:
    value: ${{ steps.run.outputs.run_supply }}
  run_privacy:
    value: ${{ steps.run.outputs.run_privacy }}
  run_api:
    value: ${{ steps.run.outputs.run_api }}
  run_malware:
    value: ${{ steps.run.outputs.run_malware }}
  run_meta:
    value: ${{ steps.run.outputs.run_meta }}
  run_dast:
    value: ${{ steps.run.outputs.run_dast }}
  enable-codeql:
    value: ${{ steps.run.outputs.enable-codeql }}
  enable-semgrep:
    value: ${{ steps.run.outputs.enable-semgrep }}
  enable-bandit:
    value: ${{ steps.run.outputs.enable-bandit }}
  enable-gosec:
    value: ${{ steps.run.outputs.enable-gosec }}
  enable-brakeman:
    value: ${{ steps.run.outputs.enable-brakeman }}
  enable-spotbugs:
    value: ${{ steps.run.outputs.enable-spotbugs }}
  enable-devskim:
    value: ${{ steps.run.outputs.enable-devskim }}
  enable-shellcheck:
    value: ${{ steps.run.outputs.enable-shellcheck }}
  enable-actionlint:
    value: ${{ steps.run.outputs.enable-actionlint }}
  enable-zizmor:
    value: ${{ steps.run.outputs.enable-zizmor }}
  enable-harden-runner:
    value: ${{ steps.run.outputs.enable-harden-runner }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OUT: ${{ runner.temp }}/settings.out
        CONFIG: ${{ inputs.config-path }}
        PROFILE: ${{ inputs.profile }}
        SCAN_SCOPE: ${{ inputs.scan-scope }}
        FAIL_ON: ${{ inputs.fail-on-severity }}
        PR_REPORT: ${{ inputs.pr-report-mode }}
        ENABLE_DAST: ${{ inputs.enable-dast }}
        DAST_URL: ${{ inputs.dast-url }}
      run: |
        set -euo pipefail
        REPO_ROOT="$(cd "$ACTION_PATH/../../.." && pwd)"
        args=(--profile "$PROFILE" --scan-scope "$SCAN_SCOPE" --fail-on "$FAIL_ON" --pr-report "$PR_REPORT" --enable-dast "$ENABLE_DAST" --dast-url "$DAST_URL")
        if [[ -n "$CONFIG" && -f "$CONFIG" ]]; then
          args+=(--config "$CONFIG")
        fi
        bash "${REPO_ROOT}/scripts/merge-scankit-settings.sh" "$OUT" "${args[@]}"
        while IFS= read -r line; do
          [[ -z "$line" ]] && continue
          echo "$line" >> "$GITHUB_OUTPUT"
        done < "$OUT"

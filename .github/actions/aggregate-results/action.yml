name: Aggregate security results
description: Build security-results/<date> summary from downloaded artifacts
inputs:
  artifacts-dir:
    description: Directory containing downloaded artifacts
    required: false
    default: artifacts
  out-root:
    description: Output root directory
    required: false
    default: security-results
  date-stamp:
    description: Date folder name (UTC YYYY-MM-DD)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Aggregate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DATE_STAMP: ${{ inputs.date-stamp }}
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
        OUT_ROOT: ${{ inputs.out-root }}
      run: |
        set -euo pipefail
        REPO_ROOT="$(cd "$ACTION_PATH/../../.." && pwd)"
        DATE="$DATE_STAMP"
        if [[ -z "$DATE" ]]; then
          DATE="$(date -u +%Y-%m-%d)"
        fi
        bash "${REPO_ROOT}/scripts/aggregate-results.sh" "$ARTIFACTS_DIR" "$OUT_ROOT" "$DATE"

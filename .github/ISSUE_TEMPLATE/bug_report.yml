name: Bug report
description: Report a scankit bug or CI failure
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction (workflow snippet, profile, repo type)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
    validations:
      required: false

name: Reusable SCA

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      scan-scope:
        type: string
        default: full
      scope_sca:
        type: string
        default: "true"
      scope_any_manifest:
        type: string
        default: "true"
      scope_python_manifest:
        type: string
        default: "true"
      scope_go_manifest:
        type: string
        default: "true"
      scope_go_code:
        type: string
        default: "true"
      scope_node_manifest:
        type: string
        default: "true"
      scope_rust_manifest:
        type: string
        default: "true"
      scope_ruby_manifest:
        type: string
        default: "true"
      scope_php_manifest:
        type: string
        default: "true"
      has_generic_code:
        type: string
        default: "true"
      has_python:
        type: string
        default: "true"
      has_go:
        type: string
        default: "true"
      has_node:
        type: string
        default: "true"
      has_rust:
        type: string
        default: "true"
      has_ruby:
        type: string
        default: "true"
      has_php:
        type: string
        default: "true"
      enable-osv:
        type: boolean
        default: true
      enable-trivy-fs:
        type: boolean
        default: true
      enable-grype:
        type: boolean
        default: true
      enable-dependency-review:
        type: boolean
        default: true
      enable-owasp-dependency-check:
        type: boolean
        default: true
      enable-pip-audit:
        type: boolean
        default: true
      enable-govulncheck:
        type: boolean
        default: true
      enable-retirejs:
        type: boolean
        default: true
      enable-cargo-audit:
        type: boolean
        default: true
      enable-cargo-deny:
        type: boolean
        default: true
      enable-bundler-audit:
        type: boolean
        default: true
      enable-php-security-checker:
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sca-osv:
    name: sca-osv
    if: inputs.enable-osv && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_any_manifest == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv.sarif
            ./
        continue-on-error: ${{ inputs.fail-on-severity == 'NONE' }}
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: osv.sarif
          category: sca-osv
        continue-on-error: true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-osv-sarif
          path: osv.sarif
          if-no-files-found: warn

  sca-trivy-fs:
    name: sca-trivy-fs
    if: inputs.enable-trivy-fs && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_any_manifest == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: Install Trivy
        run: |
          set -euo pipefail
          VERSION=0.74.0
          curl -sL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" -o trivy.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" trivy.tgz 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          tar -xzf trivy.tgz
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Trivy filesystem
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          SEV="$FAIL_ON_SEVERITY"
          ARGS=(fs --format sarif --output trivy-fs.sarif --severity .)
          if [[ "$SEV" != "NONE" ]]; then
            ARGS+=(--exit-code 1 --severity-exit-code "$SEV")
          fi
          trivy "${ARGS[@]}" || { echo "trivy exit $?"; [[ "$SEV" == "NONE" ]] || exit 1; }
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: sca-trivy-fs
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: warn

  sca-grype:
    name: sca-grype
    if: inputs.enable-grype && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_any_manifest == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Grype directory scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          path: "."
          fail-build: ${{ inputs.fail-on-severity != 'NONE' }}
          severity-cutoff: ${{ inputs.fail-on-severity == 'NONE' && 'negligible' || inputs.fail-on-severity }}
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: sca-grype
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-grype-sarif
          path: ${{ steps.grype.outputs.sarif }}
          if-no-files-found: warn

  sca-dependency-review:
    name: sca-dependency-review
    if: >
      inputs.enable-dependency-review &&
      github.event_name == 'pull_request' &&
      (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') &&
      (inputs.scan-scope != 'diff' || inputs.scope_any_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity == 'NONE' && 'critical' || inputs.fail-on-severity }}
        continue-on-error: ${{ inputs.fail-on-severity == 'NONE' }}

  sca-owasp-dependency-check:
    name: sca-owasp-dependency-check
    if: inputs.enable-owasp-dependency-check && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_any_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: OWASP Dependency-Check
        run: |
          set -euo pipefail
          VERSION=12.1.0
          curl -sSL -o dc.zip "https://github.com/jeremylong/DependencyCheck/releases/download/v${VERSION}/dependency-check-${VERSION}-release.zip"
          unzip -q dc.zip
          ./dependency-check/bin/dependency-check.sh \
            --scan . \
            --format HTML --format JSON \
            --out odc-report \
            --enableExperimental || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-owasp-dependency-check
          path: odc-report
          if-no-files-found: warn

  sca-pip-audit:
    name: sca-pip-audit
    if: inputs.enable-pip-audit && (inputs.selection-mode == 'all' || inputs.has_python == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_python_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip-audit
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          pip install --require-hashes -r "${{ steps.scankit.outputs.root }}/.github/pinned/pip-audit.txt"
          if [[ -f requirements.txt ]]; then
            pip-audit -r requirements.txt -f json -o pip-audit.json || EXIT=$?
          elif [[ -f pyproject.toml ]]; then
            pip-audit --progress-spinner off -f json -o pip-audit.json || EXIT=$?
          else
            echo "No Python dependency manifests; skipping scan body"
            echo '{"dependencies":[]}' > pip-audit.json
            EXIT=0
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-pip-audit-json
          path: pip-audit.json
          if-no-files-found: warn

  sca-govulncheck:
    name: sca-govulncheck
    if: inputs.enable-govulncheck && (inputs.selection-mode == 'all' || inputs.has_go == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_go_manifest == 'true' || inputs.scope_go_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"
      - name: govulncheck
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@d1f380186385b4f64e00313f31743df8e4b89a77  # v1.1.4
          if [[ -f go.mod ]]; then
            govulncheck -json ./... > govulncheck.json || EXIT=$?
          else
            echo "No go.mod; skip"
            echo '{}' > govulncheck.json
            EXIT=0
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-govulncheck-json
          path: govulncheck.json
          if-no-files-found: warn

  sca-retirejs:
    name: sca-retirejs
    if: inputs.enable-retirejs && (inputs.selection-mode == 'all' || inputs.has_node == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_node_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Retire.js
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          npx --yes retire@5.2.5 --outputformat json --outputpath retire.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-retirejs-json
          path: retire.json
          if-no-files-found: warn

  sca-cargo-audit:
    name: sca-cargo-audit
    if: inputs.enable-cargo-audit && (inputs.selection-mode == 'all' || inputs.has_rust == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_rust_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: Install Rust + cargo-audit
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.21.2/cargo-audit-x86_64-unknown-linux-musl-v0.21.2.tgz" -o cargo-audit.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" cargo-audit.tgz 422912aa851458bc9bf37a458b75890cb5a4e2a7e5216dcee7df91507fc594d9
          tar -xzf cargo-audit.tgz
          sudo install -m 0755 cargo-audit-*/cargo-audit /usr/local/bin/cargo-audit
          if [[ -f Cargo.toml ]]; then
            cargo audit --json > cargo-audit.json || EXIT=$?
          else
            echo '{"vulnerabilities":{"list":[]}}' > cargo-audit.json
            EXIT=0
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-cargo-audit-json
          path: cargo-audit.json
          if-no-files-found: warn

  sca-cargo-deny:
    name: sca-cargo-deny
    if: inputs.enable-cargo-deny && (inputs.selection-mode == 'all' || inputs.has_rust == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_rust_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: cargo-deny
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.18.2/cargo-deny-0.18.2-x86_64-unknown-linux-musl.tar.gz" -o cargo-deny.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" cargo-deny.tgz 43c4a79c4b9fd1fcb3dddb305a1b4d8f7ac4a72accd61bb50a0b698789ca894c
          tar -xzf cargo-deny.tgz
          sudo install -m 0755 cargo-deny-*/cargo-deny /usr/local/bin/cargo-deny
          if [[ -f Cargo.toml ]]; then
            cargo deny check 2>&1 | tee cargo-deny.txt || EXIT=$?
          else
            echo "No Cargo.toml; skip" | tee cargo-deny.txt
            EXIT=0
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-cargo-deny-txt
          path: cargo-deny.txt
          if-no-files-found: warn

  sca-bundler-audit:
    name: sca-bundler-audit
    if: inputs.enable-bundler-audit && (inputs.selection-mode == 'all' || inputs.has_ruby == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_ruby_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: bundler-audit
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          sudo gem install bundler-audit
          if [[ -f Gemfile.lock ]] || [[ -f Gemfile ]]; then
            bundle-audit check --update 2>&1 | tee bundler-audit.txt || EXIT=$?
          else
            echo "No Gemfile; skip" | tee bundler-audit.txt
            EXIT=0
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-bundler-audit-txt
          path: bundler-audit.txt
          if-no-files-found: warn

  sca-php-security-checker:
    name: sca-php-security-checker
    if: inputs.enable-php-security-checker && (inputs.selection-mode == 'all' || inputs.has_php == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_php_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: local-php-security-checker
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/fabpot/local-php-security-checker/releases/download/v2.0.0/local-php-security-checker_2.0.0_linux_amd64" -o php-security-checker
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" php-security-checker 96f5db138921c60e18a551221c7f93e787cccc7ed5953b80920b34d97af0ce10
          chmod +x php-security-checker
          if [[ -f composer.lock ]]; then
            ./php-security-checker --format=json > php-security.json || EXIT=$?
          else
            echo '[]' > php-security.json
            echo "No composer.lock; skip"
            EXIT=0
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-php-security-json
          path: php-security.json
          if-no-files-found: warn

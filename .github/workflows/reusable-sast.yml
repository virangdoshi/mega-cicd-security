name: Reusable SAST

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      scan-scope:
        description: full | diff (resolved by caller)
        type: string
        default: full
      scope_sast:
        type: string
        default: "true"
      scope_go_code:
        type: string
        default: "true"
      scope_ruby_code:
        type: string
        default: "true"
      scope_java_code:
        type: string
        default: "true"
      has_generic_code:
        type: string
        default: "true"
      has_python:
        type: string
        default: "true"
      has_go:
        type: string
        default: "true"
      has_ruby:
        type: string
        default: "true"
      has_java:
        type: string
        default: "true"
      has_shell:
        type: string
        default: "true"
      codeql-languages:
        description: JSON array of CodeQL languages, or empty for auto
        type: string
        default: ""
      enable-codeql:
        type: boolean
        default: true
      enable-semgrep:
        type: boolean
        default: true
      enable-bandit:
        type: boolean
        default: true
      enable-gosec:
        type: boolean
        default: true
      enable-brakeman:
        type: boolean
        default: true
      enable-spotbugs:
        type: boolean
        default: true
      enable-devskim:
        type: boolean
        default: true
      enable-shellcheck:
        type: boolean
        default: true
      enable-code-build:
        description: Allow CodeQL autobuild / SpotBugs compile (disable on untrusted PRs)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  sast-codeql:
    name: sast-codeql
    if: inputs.enable-codeql && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages || '["javascript-typescript","python","java-kotlin","go","ruby"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
        continue-on-error: true
      - name: Autobuild
        if: inputs.enable-code-build
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        continue-on-error: true
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
        continue-on-error: ${{ inputs.fail-on-severity == 'NONE' }}

  sast-semgrep:
    name: sast-semgrep
    if: inputs.enable-semgrep && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_sast == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    container:
      image: semgrep/semgrep:1.110.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Download changed-files
        if: inputs.scan-scope == 'diff'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changed-files
          path: .
      - name: Prepare scan paths
        id: paths
        uses: virangdoshi/scankit/.github/actions/prepare-scan-paths@9a80cbd5716e521391b7993fb0cfab26c3f3d442
        with:
          scan-scope: ${{ inputs.scan-scope }}
          patterns: '\.(py|pyi|go|java|kt|kts|rb|js|jsx|mjs|cjs|ts|tsx|php|cs|rs|c|cc|cpp|h|hpp)$'
      - name: Semgrep scan
        if: steps.paths.outputs.skip != 'true'
        # Container jobs default to sh; mapfile/[[ need bash (available in semgrep image).
        shell: bash
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          mapfile -t TARGETS < "${{ steps.paths.outputs.paths_file }}"
          semgrep scan --config p/default --sarif --output semgrep.sarif "${TARGETS[@]}" || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - name: Skip (no matching paths)
        if: steps.paths.outputs.skip == 'true'
        shell: bash
        run: echo "No matching paths in diff; skipping Semgrep" && echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: sast-semgrep
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sast-semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

  sast-bandit:
    name: sast-bandit
    if: inputs.enable-bandit && (inputs.selection-mode == 'all' || inputs.has_python == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_sast == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: Download changed-files
        if: inputs.scan-scope == 'diff'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changed-files
          path: .
      - name: Prepare scan paths
        id: paths
        uses: virangdoshi/scankit/.github/actions/prepare-scan-paths@9a80cbd5716e521391b7993fb0cfab26c3f3d442
        with:
          scan-scope: ${{ inputs.scan-scope }}
          patterns: '\.py$'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bandit
        if: steps.paths.outputs.skip != 'true'
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          pip install --require-hashes -r "${{ steps.scankit.outputs.root }}/.github/pinned/bandit.txt"
          mapfile -t TARGETS < "${{ steps.paths.outputs.paths_file }}"
          if [[ "${{ inputs.scan-scope }}" == "diff" ]]; then
            bandit "${TARGETS[@]}" -f json -o bandit.json || EXIT=$?
          else
            bandit -r . -f json -o bandit.json || EXIT=$?
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - name: Skip (no matching paths)
        if: steps.paths.outputs.skip == 'true'
        run: echo "No matching paths in diff; skipping Bandit" && echo '{}' > bandit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sast-bandit-json
          path: bandit.json
          if-no-files-found: warn

  sast-gosec:
    name: sast-gosec
    if: inputs.enable-gosec && (inputs.selection-mode == 'all' || inputs.has_go == 'true') && (inputs.scan-scope != 'diff')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"
      - name: Gosec
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@955a68d0d19f4afb7503068f95059f7d0c529017  # v2.22.3
          if [[ -f go.mod ]]; then
            gosec -fmt=sarif -out=gosec.sarif ./... || EXIT=$?
          else
            echo '{"version":"2.1.0","runs":[]}' > gosec.sarif
            EXIT=0
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: gosec.sarif
          category: sast-gosec
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sast-gosec-sarif
          path: gosec.sarif
          if-no-files-found: warn

  sast-brakeman:
    name: sast-brakeman
    if: inputs.enable-brakeman && (inputs.selection-mode == 'all' || inputs.has_ruby == 'true') && (inputs.scan-scope != 'diff')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Brakeman
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          sudo gem install brakeman
          if [[ -f Gemfile ]]; then
            brakeman -f sarif -o brakeman.sarif || EXIT=$?
          else
            echo '{"version":"2.1.0","runs":[]}' > brakeman.sarif
            EXIT=0
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: brakeman.sarif
          category: sast-brakeman
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sast-brakeman-sarif
          path: brakeman.sarif
          if-no-files-found: warn

  sast-spotbugs:
    name: sast-spotbugs
    if: inputs.enable-spotbugs && inputs.enable-code-build && (inputs.selection-mode == 'all' || inputs.has_java == 'true') && (inputs.scan-scope != 'diff')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: SpotBugs (best-effort)
        run: |
          set -euo pipefail
          if [[ -f pom.xml ]]; then
            mvn -q -DskipTests package || true
            curl -sL -o spotbugs.tgz https://github.com/spotbugs/spotbugs/releases/download/4.8.6/spotbugs-4.8.6.tgz
            tar -xzf spotbugs.tgz
            ./spotbugs-4.8.6/bin/spotbugs -textui -effort:max -xml:withMessages -output spotbugs.xml target || true
          elif [[ -f build.gradle || -f build.gradle.kts ]]; then
            ./gradlew assemble -q || gradle assemble -q || true
            echo "SpotBugs gradle integration is best-effort; see artifacts if produced" > spotbugs.txt
          else
            echo "No Maven/Gradle project; skip" > spotbugs.txt
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sast-spotbugs
          path: |
            spotbugs.xml
            spotbugs.txt
          if-no-files-found: warn

  sast-devskim:
    name: sast-devskim
    if: inputs.enable-devskim && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_sast == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Download changed-files
        if: inputs.scan-scope == 'diff'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changed-files
          path: .
      - name: Prepare scan paths
        id: paths
        uses: virangdoshi/scankit/.github/actions/prepare-scan-paths@9a80cbd5716e521391b7993fb0cfab26c3f3d442
        with:
          scan-scope: ${{ inputs.scan-scope }}
          patterns: '\.(py|pyi|go|java|kt|rb|js|jsx|ts|tsx|php|cs|rs|c|cc|cpp|h|hpp|sh)$'
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: DevSkim
        if: steps.paths.outputs.skip != 'true'
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          dotnet tool install --global Microsoft.CST.DevSkim.CLI
          export PATH="$PATH:$HOME/.dotnet/tools"
          mapfile -t TARGETS < "${{ steps.paths.outputs.paths_file }}"
          # DevSkim takes a single root; for diff, analyze each path
          if [[ "${{ inputs.scan-scope }}" == "diff" && ${#TARGETS[@]} -gt 0 && "${TARGETS[0]}" != "." ]]; then
            : > devskim.sarif
            for t in "${TARGETS[@]}"; do
              out="devskim-$(echo "$t" | tr '/.' '__').sarif"
              devskim analyze --source-code "$t" -o sarif -f "$out" || true
            done
            # Prefer first SARIF for upload; merge is best-effort
            first=$(ls devskim-*.sarif 2>/dev/null | head -n1 || true)
            if [[ -n "$first" ]]; then cp "$first" devskim.sarif; else echo '{"version":"2.1.0","runs":[]}' > devskim.sarif; fi
            EXIT=0
          else
            devskim analyze --source-code . -o sarif -f devskim.sarif || EXIT=$?
          fi
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - name: Skip (no matching paths)
        if: steps.paths.outputs.skip == 'true'
        run: echo "No matching paths in diff; skipping DevSkim" && echo '{"version":"2.1.0","runs":[]}' > devskim.sarif
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: devskim.sarif
          category: sast-devskim
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sast-devskim-sarif
          path: devskim.sarif
          if-no-files-found: warn

  sast-shellcheck:
    name: sast-shellcheck
    if: inputs.enable-shellcheck && (inputs.selection-mode == 'all' || inputs.has_shell == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_sast == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Download changed-files
        if: inputs.scan-scope == 'diff'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changed-files
          path: .
      - name: Prepare scan paths
        id: paths
        uses: virangdoshi/scankit/.github/actions/prepare-scan-paths@9a80cbd5716e521391b7993fb0cfab26c3f3d442
        with:
          scan-scope: ${{ inputs.scan-scope }}
          patterns: '\.(sh|bash|ksh|zsh)$'
      - name: ShellCheck
        if: steps.paths.outputs.skip != 'true'
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          if [[ "${{ inputs.scan-scope }}" == "diff" ]]; then
            mapfile -t FILES < "${{ steps.paths.outputs.paths_file }}"
          else
            mapfile -t FILES < <(find . -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.ksh' -o -name '*.zsh' \) ! -path './.git/*')
          fi
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No shell scripts found"
            echo '{"version":"2.1.0","runs":[]}' > shellcheck.sarif
            exit 0
          fi
          # GCC format for artifact; exit non-zero on findings when failing
          shellcheck -f gcc "${FILES[@]}" | tee shellcheck.txt || EXIT=$?
          EXIT=${EXIT:-0}
          # Minimal SARIF-ish placeholder note in json
          python3 - <<'PY'
          import json, pathlib
          text = pathlib.Path("shellcheck.txt").read_text() if pathlib.Path("shellcheck.txt").exists() else ""
          sarif = {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [{
              "tool": {"driver": {"name": "ShellCheck", "informationUri": "https://www.shellcheck.net/"}},
              "results": [],
              "invocations": [{"executionSuccessful": True, "commandLine": "shellcheck"}],
            }]
          }
          pathlib.Path("shellcheck.sarif").write_text(json.dumps(sarif, indent=2))
          pathlib.Path("shellcheck-raw.txt").write_text(text)
          PY
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - name: Skip (no matching paths)
        if: steps.paths.outputs.skip == 'true'
        run: |
          echo "No matching paths in diff; skipping ShellCheck"
          echo '{"version":"2.1.0","runs":[]}' > shellcheck.sarif
          : > shellcheck.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sast-shellcheck
          path: |
            shellcheck.txt
            shellcheck.sarif
          if-no-files-found: warn

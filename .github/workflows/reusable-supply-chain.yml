name: Reusable Supply Chain

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: NONE
      checkout-ref:
        type: string
        default: ""
      scan-scope:
        type: string
        default: full
      scope_supply:
        type: string
        default: "true"
      scope_workflows:
        type: string
        default: "true"
      scope_any_manifest:
        type: string
        default: "true"
      has_generic_code:
        type: string
        default: "true"
      has_actions:
        type: string
        default: "true"
      has_python:
        type: string
        default: "true"
      has_node:
        type: string
        default: "true"
      has_go:
        type: string
        default: "true"
      image:
        type: string
        default: ""
      cosign-certificate-identity:
        type: string
        default: ""
      cosign-certificate-oidc-issuer:
        type: string
        default: ""
      slsa-artifact:
        type: string
        default: ""
      slsa-source-uri:
        type: string
        default: ""
      enable-scorecard:
        type: boolean
        default: true
      enable-guarddog:
        type: boolean
        default: true
      enable-sbomqs:
        type: boolean
        default: true
      enable-pinact:
        type: boolean
        default: true
      enable-ratchet:
        type: boolean
        default: true
      enable-slsa-verifier:
        type: boolean
        default: true
      enable-cosign-verify:
        type: boolean
        default: true
      enable-security-insights:
        type: boolean
        default: true
      scorecard-publish-results:
        description: Publish Scorecard results to OpenSSF API (requires id-token)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  supply-scorecard:
    name: supply-scorecard
    # Repo-level OpenSSF checks (branch protection, tokens, …), not PR-diff
    # analysis. Official cadence is push-to-default + schedule, not pull_request.
    if: inputs.enable-scorecard && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ inputs.scorecard-publish-results }}
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: scorecard.sarif
          category: supply-scorecard
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-scorecard-sarif
          path: scorecard.sarif

  supply-guarddog:
    name: supply-guarddog
    if: inputs.enable-guarddog && (inputs.selection-mode == 'all' || inputs.has_python == 'true' || inputs.has_node == 'true' || inputs.has_go == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_any_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: GuardDog
        run: |
          set -euo pipefail
          pip install --require-hashes -r "${{ steps.scankit.outputs.root }}/.github/pinned/guarddog.txt"
          mkdir -p guarddog-out
          if [[ -f requirements.txt ]]; then
            guarddog pypi scan requirements.txt --output-format json > guarddog-out/pypi.json || true
          fi
          if [[ -f package.json ]]; then
            guarddog npm scan package.json --output-format json > guarddog-out/npm.json || true
          fi
          if [[ -f go.mod ]]; then
            guarddog go scan go.mod --output-format json > guarddog-out/go.json || true
          fi
          ls -la guarddog-out || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-guarddog
          path: guarddog-out
          if-no-files-found: warn

  supply-sbomqs:
    name: supply-sbomqs
    if: inputs.enable-sbomqs && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_any_manifest == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"
      - name: Generate SBOM then score
        run: |
          set -euo pipefail
          curl -sL "https://github.com/anchore/syft/releases/download/v1.27.1/syft_1.27.1_linux_amd64.tar.gz" -o syft.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" syft.tgz c2cb5867a238baf41adf15f7e01e28cbd886378859eed81e52c080ca0346eefe
          tar -xzf syft.tgz
          sudo install -m 0755 syft /usr/local/bin/syft
          syft dir:. -o cyclonedx-json=sbom.cdx.json
          go install github.com/interlynk-io/sbomqs@535bcec4bb80a2624a088d9ca1a23160f2ab8750  # v0.2.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          sbomqs score sbom.cdx.json | tee sbomqs.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-sbomqs
          path: |
            sbomqs.txt
            sbom.cdx.json
          if-no-files-found: warn

  supply-pinact:
    name: supply-pinact
    if: inputs.enable-pinact && (inputs.selection-mode == 'all' || inputs.has_actions == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"
      - name: pinact
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          go install github.com/suzuki-shunsuke/pinact/cmd/pinact@175ef6468b3ff93c52f4194670b5d79e118c7299  # v1.1.0
          pinact run --check || EXIT=$?
          EXIT=${EXIT:-0}
          pinact run --check 2>&1 | tee pinact.txt || true
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-pinact-txt
          path: pinact.txt
          if-no-files-found: warn

  supply-ratchet:
    name: supply-ratchet
    if: inputs.enable-ratchet && (inputs.selection-mode == 'all' || inputs.has_actions == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
      - name: ratchet check
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          go install github.com/sethvargo/ratchet@8b4ca256dbed184350608a3023620f267f0a5253  # v0.11.4
          mapfile -t WFS < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null || true)
          if [[ ${#WFS[@]} -eq 0 ]]; then
            echo "No workflows"; echo ok > ratchet.txt; exit 0
          fi
          ratchet check "${WFS[@]}" 2>&1 | tee ratchet.txt || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-ratchet-txt
          path: ratchet.txt
          if-no-files-found: warn

  supply-slsa-verifier:
    name: supply-slsa-verifier
    if: inputs.enable-slsa-verifier && inputs.slsa-artifact != '' && inputs.slsa-source-uri != '' && (inputs.scan-scope != 'diff' || inputs.scope_supply == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: Install slsa-verifier
        run: |
          curl -sL "https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.0/slsa-verifier-linux-amd64" -o slsa-verifier
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" slsa-verifier 499befb675efcca9001afe6e5156891b91e71f9c07ab120a8943979f85cc82e6
          chmod +x slsa-verifier
      - name: Verify
        env:
          SLSA_ARTIFACT: ${{ inputs.slsa-artifact }}
          SLSA_SOURCE_URI: ${{ inputs.slsa-source-uri }}
        run: |
          ./slsa-verifier verify-artifact "$SLSA_ARTIFACT" \
            --source-uri "$SLSA_SOURCE_URI" | tee slsa-verify.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-slsa-verify
          path: slsa-verify.txt
          if-no-files-found: warn

  supply-cosign-verify:
    name: supply-cosign-verify
    if: inputs.enable-cosign-verify && inputs.image != '' && inputs.cosign-certificate-identity != '' && (inputs.scan-scope != 'diff' || inputs.scope_supply == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify
        env:
          COSIGN_CERTIFICATE_IDENTITY: ${{ inputs.cosign-certificate-identity }}
          COSIGN_CERTIFICATE_OIDC_ISSUER: ${{ inputs.cosign-certificate-oidc-issuer || 'https://token.actions.githubusercontent.com' }}
          IMAGE: ${{ inputs.image }}
        run: |
          cosign verify \
            --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
            "$IMAGE" | tee cosign-verify.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-cosign-verify
          path: cosign-verify.txt
          if-no-files-found: warn

  supply-security-insights:
    name: supply-security-insights
    if: inputs.enable-security-insights && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_supply == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Check SECURITY-INSIGHTS.yml
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          FOUND=false
          for f in SECURITY-INSIGHTS.yml SECURITY-INSIGHTS.yaml .github/SECURITY-INSIGHTS.yml security-insights.yml; do
            if [[ -f "$f" ]]; then
              echo "Found $f" | tee security-insights.txt
              FOUND=true
              break
            fi
          done
          if [[ "$FOUND" != true ]]; then
            echo "SECURITY-INSIGHTS.yml not found (OpenSSF Security Insights signal)" | tee security-insights.txt
            if [[ "$FAIL_ON_SEVERITY" != "NONE" ]]; then
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-security-insights
          path: security-insights.txt

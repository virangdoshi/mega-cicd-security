name: Reusable Privacy / PII

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      scan-scope:
        type: string
        default: full
      scope_privacy:
        type: string
        default: "true"
      has_generic_code:
        type: string
        default: "true"
      privacy-paths:
        type: string
        default: ""
      enable-bearer:
        type: boolean
        default: true
      enable-presidio:
        type: boolean
        default: true
      enable-semgrep-privacy:
        type: boolean
        default: true
      enable-application-inspector:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  privacy-bearer:
    name: privacy-bearer
    if: inputs.enable-bearer && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_privacy == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: Download changed-files
        if: inputs.scan-scope == 'diff'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changed-files
          path: .
      - name: Prepare scan paths
        id: paths
        uses: virangdoshi/scankit/.github/actions/prepare-scan-paths@9a80cbd5716e521391b7993fb0cfab26c3f3d442
        with:
          scan-scope: ${{ inputs.scan-scope }}
          patterns: '\.(py|pyi|go|java|kt|rb|js|jsx|ts|tsx|php|cs|rs)$'
      - name: Bearer
        if: steps.paths.outputs.skip != 'true'
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/Bearer/bearer/releases/download/v1.46.0/bearer_1.46.0_linux_amd64.tar.gz" -o bearer.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" bearer.tgz ab3823519649834db74768af54b7ac08aa38d32286cb761c72693686427b1a1b
          tar -xzf bearer.tgz
          sudo install -m 0755 bearer /usr/local/bin/bearer
          mapfile -t TARGETS < "${{ steps.paths.outputs.paths_file }}"
          bearer scan "${TARGETS[@]}" --format sarif --output bearer.sarif || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: bearer.sarif
          category: privacy-bearer
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: privacy-bearer-sarif
          path: bearer.sarif
          if-no-files-found: warn

  privacy-presidio:
    name: privacy-presidio
    if: inputs.enable-presidio && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_privacy == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Presidio Analyzer
        run: |
          set -euo pipefail
          pip install --require-hashes -r "${{ steps.scankit.outputs.root }}/.github/pinned/presidio-analyzer.txt"
          python3 - <<'PY'
          import json, os, pathlib, glob
          from presidio_analyzer import AnalyzerEngine
          paths = os.environ.get("PRIVACY_PATHS", "").strip()
          patterns = paths.split() if paths else ["**/*.csv", "**/*.json", "**/*.txt", "**/*.md", "**/*.yml", "**/*.yaml"]
          files = []
          for p in patterns:
              files.extend(glob.glob(p, recursive=True))
          files = [f for f in files if pathlib.Path(f).is_file() and ".git" not in f][:50]
          if not files:
              print("No privacy-paths matched; skip")
              pathlib.Path("presidio.json").write_text("[]")
              raise SystemExit(0)
          analyzer = AnalyzerEngine()
          results = []
          for f in files:
              try:
                  text = pathlib.Path(f).read_text(errors="ignore")[:20000]
              except Exception:
                  continue
              hits = analyzer.analyze(text=text, language="en")
              if hits:
                  results.append({"file": f, "entities": [h.to_dict() for h in hits]})
          pathlib.Path("presidio.json").write_text(json.dumps(results, indent=2))
          print(f"Files scanned: {len(files)}; files with PII signals: {len(results)}")
          if results and os.environ.get("FAIL_ON", "HIGH") != "NONE":
              raise SystemExit(1)
          PY
        env:
          PRIVACY_PATHS: ${{ inputs.privacy-paths }}
          FAIL_ON: ${{ inputs.fail-on-severity }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: privacy-presidio-json
          path: presidio.json
          if-no-files-found: warn

  privacy-semgrep:
    name: privacy-semgrep
    if: inputs.enable-semgrep-privacy && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_privacy == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.110.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Semgrep privacy/security rules
        # Container jobs default to sh; [[ / pipefail need bash.
        shell: bash
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          # Overlap with SAST intentional; try secrets/security packs
          semgrep scan --config p/secrets --config p/security-audit --sarif --output semgrep-privacy.sarif . || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: semgrep-privacy.sarif
          category: privacy-semgrep
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: privacy-semgrep-sarif
          path: semgrep-privacy.sarif
          if-no-files-found: warn

  privacy-application-inspector:
    name: privacy-application-inspector
    if: inputs.enable-application-inspector && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_privacy == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Application Inspector
        run: |
          set -euo pipefail
          dotnet tool install --global Microsoft.CST.ApplicationInspector.CLI
          export PATH="$PATH:$HOME/.dotnet/tools"
          appinspector analyze -s . -f json -o appinspector.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: privacy-application-inspector
          path: appinspector.json
          if-no-files-found: warn

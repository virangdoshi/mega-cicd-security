name: Reusable Meta (Actions security)

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      scan-scope:
        type: string
        default: full
      scope_meta:
        type: string
        default: "true"
      scope_workflows:
        type: string
        default: "true"
      has_actions:
        type: string
        default: "true"
      enable-actionlint:
        type: boolean
        default: true
      enable-zizmor:
        type: boolean
        default: true
      enable-harden-runner:
        type: boolean
        default: true
      zizmor-advanced-security:
        description: Upload zizmor SARIF to Code Scanning (needs Code Scanning enabled)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  meta-actionlint:
    name: meta-actionlint
    if: inputs.enable-actionlint && (inputs.selection-mode == 'all' || inputs.has_actions == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        if: inputs.enable-harden-runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          args: -color
        continue-on-error: ${{ inputs.fail-on-severity == 'NONE' }}

  meta-zizmor:
    name: meta-zizmor
    if: inputs.enable-zizmor && (inputs.selection-mode == 'all' || inputs.has_actions == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_workflows == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        if: inputs.enable-harden-runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Soft-fail SARIF upload when Code Scanning is not enabled on the repo
          advanced-security: ${{ inputs.zizmor-advanced-security }}
        continue-on-error: true

name: Reusable API Static Security

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      has_openapi:
        type: string
        default: "true"
      has_graphql:
        type: string
        default: "true"
      api-spec-paths:
        type: string
        default: ""
      enable-spectral:
        type: boolean
        default: true
      enable-vacuum:
        type: boolean
        default: true
      enable-graphql-linter:
        type: boolean
        default: true
      enable-ibm-openapi-validator:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  api-spectral:
    name: api-spectral
    if: inputs.enable-spectral && (inputs.selection-mode == 'all' || inputs.has_openapi == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Spectral
        env:
          API_SPEC_PATHS: ${{ inputs.api-spec-paths }}
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix .github/pinned/npm-api
          echo "$GITHUB_WORKSPACE/.github/pinned/npm-api/node_modules/.bin" >> "$GITHUB_PATH"
          mapfile -t SPECS < <(find . -type f \( -iname 'openapi*.yml' -o -iname 'openapi*.yaml' -o -iname 'openapi*.json' -o -iname 'swagger*.yml' -o -iname 'swagger*.yaml' -o -iname 'swagger*.json' -o -iname 'asyncapi*.yml' -o -iname 'asyncapi*.yaml' -o -iname 'asyncapi*.json' \) ! -path './.git/*' ! -path './node_modules/*')
          if [[ -n "$API_SPEC_PATHS" ]]; then
            read -r -a SPECS <<< "$API_SPEC_PATHS"
          fi
          if [[ ${#SPECS[@]} -eq 0 ]]; then
            echo "No API specs found"; echo '[]' > spectral.json; exit 0
          fi
          cat > .spectral.yaml <<'EOF'
          extends:
            - spectral:oas
            - spectral:asyncapi
          EOF
          spectral lint "${SPECS[@]}" -f json -o spectral.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-spectral-json
          path: spectral.json
          if-no-files-found: warn

  api-vacuum:
    name: api-vacuum
    if: inputs.enable-vacuum && (inputs.selection-mode == 'all' || inputs.has_openapi == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: vacuum
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/daveshanley/vacuum/releases/download/v0.14.3/vacuum_0.14.3_linux_x86_64.tar.gz" -o vacuum.tgz
          bash scripts/verify-sha256.sh vacuum.tgz d5d88fb8550e2068e4cb2667d259b16db5eb5d7888d38045e9aca9d934eb1b1e
          tar -xzf vacuum.tgz
          mapfile -t SPECS < <(find . -type f \( -iname 'openapi*.yml' -o -iname 'openapi*.yaml' -o -iname 'openapi*.json' -o -iname 'swagger*.yml' -o -iname 'swagger*.yaml' -o -iname 'swagger*.json' \) ! -path './.git/*')
          if [[ ${#SPECS[@]} -eq 0 ]]; then
            echo "No specs"; echo '{}' > vacuum-report.json; exit 0
          fi
          ./vacuum lint "${SPECS[0]}" -j > vacuum-report.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-vacuum-json
          path: vacuum-report.json
          if-no-files-found: warn

  api-graphql-linter:
    name: api-graphql-linter
    if: inputs.enable-graphql-linter && (inputs.selection-mode == 'all' || inputs.has_graphql == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: graphql-schema-linter
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix .github/pinned/npm-api
          echo "$GITHUB_WORKSPACE/.github/pinned/npm-api/node_modules/.bin" >> "$GITHUB_PATH"
          mapfile -t SCHEMAS < <(find . -type f \( -name '*.graphql' -o -name '*.gql' \) ! -path './.git/*')
          if [[ ${#SCHEMAS[@]} -eq 0 ]]; then
            echo "No GraphQL schemas"; echo ok > graphql-linter.txt; exit 0
          fi
          graphql-schema-linter "${SCHEMAS[@]}" 2>&1 | tee graphql-linter.txt || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-graphql-linter
          path: graphql-linter.txt
          if-no-files-found: warn

  api-ibm-openapi-validator:
    name: api-ibm-openapi-validator
    if: inputs.enable-ibm-openapi-validator && (inputs.selection-mode == 'all' || inputs.has_openapi == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: IBM OpenAPI Validator
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix .github/pinned/npm-api
          echo "$GITHUB_WORKSPACE/.github/pinned/npm-api/node_modules/.bin" >> "$GITHUB_PATH"
          mapfile -t SPECS < <(find . -type f \( -iname 'openapi*.yml' -o -iname 'openapi*.yaml' -o -iname 'openapi*.json' -o -iname 'swagger*.yml' -o -iname 'swagger*.yaml' -o -iname 'swagger*.json' \) ! -path './.git/*')
          if [[ ${#SPECS[@]} -eq 0 ]]; then
            echo "No specs"; echo '{}' > ibm-openapi.json; exit 0
          fi
          lint-openapi "${SPECS[0]}" -j > ibm-openapi.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-ibm-openapi-json
          path: ibm-openapi.json
          if-no-files-found: warn

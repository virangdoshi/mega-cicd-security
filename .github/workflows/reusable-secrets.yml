name: Reusable Secrets Scanning

on:
  workflow_call:
    inputs:
      selection-mode:
        description: detected | all
        type: string
        default: detected
      fail-on-severity:
        description: CRITICAL | HIGH | MEDIUM | LOW | NONE
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      has_generic_code:
        type: string
        default: "true"
      enable-gitleaks:
        type: boolean
        default: true
      enable-trufflehog:
        type: boolean
        default: true
      enable-detect-secrets:
        type: boolean
        default: true
      enable-secretlint:
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  secrets-gitleaks:
    name: secrets-gitleaks
    if: inputs.enable-gitleaks && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  secrets-trufflehog:
    name: secrets-trufflehog
    if: inputs.enable-trufflehog && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@7dc056a193116ba8d82154bf0549381c8fb8545c # v3.88.14
        with:
          path: ./
          base: ${{ github.event.repository.default_branch || 'main' }}
          extra_args: --only-verified=false

  secrets-detect-secrets:
    name: secrets-detect-secrets
    if: inputs.enable-detect-secrets && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Scan
        run: |
          set -euo pipefail
          detect-secrets scan --all-files --force-use-all-plugins > detect-secrets.json || true
          # Fail if any secrets found (baseline empty)
          COUNT=$(python3 -c "import json;d=json.load(open('detect-secrets.json'));print(sum(len(v) for v in d.get('results',{}).values()))")
          echo "Findings: $COUNT"
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$COUNT" -gt 0 ]]; then
            exit 1
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: secrets-detect-secrets-json
          path: detect-secrets.json
          if-no-files-found: warn

  secrets-secretlint:
    name: secrets-secretlint
    if: inputs.enable-secretlint && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
      - name: Run secretlint
        run: |
          set -euo pipefail
          npx --yes secretlint --version
          # Default config via package; scan all files
          npx --yes secretlint "**/*" --format json > secretlint.json || EXIT=$?
          EXIT=${EXIT:-0}
          cat secretlint.json || true
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: secrets-secretlint-json
          path: secretlint.json
          if-no-files-found: warn

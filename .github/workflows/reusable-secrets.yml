name: Reusable Secrets Scanning

on:
  workflow_call:
    inputs:
      selection-mode:
        description: detected | all
        type: string
        default: detected
      fail-on-severity:
        description: CRITICAL | HIGH | MEDIUM | LOW | NONE
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      scan-scope:
        type: string
        default: full
      scope_secrets:
        type: string
        default: "true"
      has_generic_code:
        type: string
        default: "true"
      enable-gitleaks:
        type: boolean
        default: true
      enable-trufflehog:
        type: boolean
        default: true
      enable-detect-secrets:
        type: boolean
        default: true
      enable-secretlint:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets-gitleaks:
    name: secrets-gitleaks
    if: inputs.enable-gitleaks && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_secrets == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  secrets-trufflehog:
    name: secrets-trufflehog
    if: inputs.enable-trufflehog && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_secrets == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch || 'main' }}
          extra_args: --only-verified=false

  secrets-detect-secrets:
    name: secrets-detect-secrets
    if: inputs.enable-detect-secrets && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_secrets == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Download changed-files
        if: inputs.scan-scope == 'diff'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changed-files
          path: .
      - name: Prepare scan paths
        id: paths
        uses: virangdoshi/scankit/.github/actions/prepare-scan-paths@28b09fb9792195856016dd519b67070bf6620b13
        with:
          scan-scope: ${{ inputs.scan-scope }}
          patterns: ''
      - name: Setup Python
        if: steps.paths.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        if: steps.paths.outputs.skip != 'true'
        run: pip install --require-hashes -r "${GITHUB_WORKSPACE}/.github/pinned/detect-secrets.txt"
      - name: Scan
        if: steps.paths.outputs.skip != 'true'
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.scan-scope }}" == "diff" ]]; then
            mapfile -t TARGETS < "${{ steps.paths.outputs.paths_file }}"
            detect-secrets scan --force-use-all-plugins "${TARGETS[@]}" > detect-secrets.json || true
          else
            detect-secrets scan --all-files --force-use-all-plugins > detect-secrets.json || true
          fi
          # Fail if any secrets found (baseline empty)
          COUNT=$(python3 -c "import json;d=json.load(open('detect-secrets.json'));print(sum(len(v) for v in d.get('results',{}).values()))")
          echo "Findings: $COUNT"
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$COUNT" -gt 0 ]]; then
            exit 1
          fi
      - name: Skip (no matching paths)
        if: steps.paths.outputs.skip == 'true'
        run: echo '{}' > detect-secrets.json
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-detect-secrets-json
          path: detect-secrets.json
          if-no-files-found: warn

  secrets-secretlint:
    name: secrets-secretlint
    if: inputs.enable-secretlint && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_secrets == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Download changed-files
        if: inputs.scan-scope == 'diff'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changed-files
          path: .
      - name: Prepare scan paths
        id: paths
        uses: virangdoshi/scankit/.github/actions/prepare-scan-paths@28b09fb9792195856016dd519b67070bf6620b13
        with:
          scan-scope: ${{ inputs.scan-scope }}
          patterns: ''
      - name: Setup Node
        if: steps.paths.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Run secretlint
        if: steps.paths.outputs.skip != 'true'
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          npx --yes secretlint@9.0.0 --version
          if [[ "${{ inputs.scan-scope }}" == "diff" ]]; then
            mapfile -t TARGETS < "${{ steps.paths.outputs.paths_file }}"
            npx --yes secretlint@9.0.0 "${TARGETS[@]}" --format json > secretlint.json || EXIT=$?
          else
            npx --yes secretlint@9.0.0 "**/*" --format json > secretlint.json || EXIT=$?
          fi
          EXIT=${EXIT:-0}
          cat secretlint.json || true
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - name: Skip (no matching paths)
        if: steps.paths.outputs.skip == 'true'
        run: echo '[]' > secretlint.json
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-secretlint-json
          path: secretlint.json
          if-no-files-found: warn

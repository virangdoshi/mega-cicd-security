name: Reusable DAST (optional)

on:
  workflow_call:
    inputs:
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      dast-url:
        description: Staging URL for OWASP ZAP baseline (never production)
        type: string
        required: true
      enable-zap:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  dast-zap-baseline:
    name: dast-zap-baseline
    if: inputs.enable-zap && inputs.dast-url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        continue-on-error: ${{ inputs.fail-on-severity == 'NONE' }}
        with:
          target: ${{ inputs.dast-url }}
          cmd_options: -a
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-zap-report
          path: report_html.html
          if-no-files-found: ignore

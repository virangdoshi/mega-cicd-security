name: Reusable Publish Results

on:
  workflow_call:
    inputs:
      results-publish-mode:
        description: none | branch | pull-request
        type: string
        default: none
      results-branch:
        description: Target branch for mode=branch (must match security-results or security-results/*)
        type: string
        default: security-results
      results-path:
        description: Relative directory under the repo root for published results
        type: string
        default: security-results
      pr-title:
        type: string
        default: "chore: update security scan results"

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  publish:
    name: publish-results
    if: inputs.results-publish-mode == 'branch' || inputs.results-publish-mode == 'pull-request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate publish inputs
        env:
          RESULTS_BRANCH: ${{ inputs.results-branch }}
          RESULTS_PATH: ${{ inputs.results-path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          # Refuse default branch and anything outside security-results prefix
          case "$RESULTS_BRANCH" in
            main|master|"$DEFAULT_BRANCH")
              echo "::error::results-branch must not be the default branch ($RESULTS_BRANCH)"
              exit 1
              ;;
            security-results|security-results/*)
              ;;
            *)
              echo "::error::results-branch must be 'security-results' or 'security-results/<name>' (got: $RESULTS_BRANCH)"
              exit 1
              ;;
          esac
          # Relative path only, no traversal
          case "$RESULTS_PATH" in
            ""|/*|*/|.*|*..*)
              echo "::error::results-path must be a relative path without '..' (got: $RESULTS_PATH)"
              exit 1
              ;;
            security-results|security-results/*)
              ;;
            *)
              echo "::error::results-path must be under security-results/ (got: $RESULTS_PATH)"
              exit 1
              ;;
          esac
      - name: Download scan artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          # Prefer named scan reports; missing artifacts are OK when some jobs skipped
          pattern: "*"
        continue-on-error: true
      - name: Aggregate
        uses: ./.github/actions/aggregate-results
        with:
          artifacts-dir: artifacts
          out-root: ${{ inputs.results-path }}
      - name: Commit to branch
        if: inputs.results-publish-mode == 'branch'
        env:
          RESULTS_BRANCH: ${{ inputs.results-branch }}
          RESULTS_PATH: ${{ inputs.results-path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RESULTS_BRANCH"
          git add -- "$RESULTS_PATH"
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: security results $(date -u +%Y-%m-%d)"
          git push -u origin "HEAD:$RESULTS_BRANCH"
      - name: Create or update PR
        if: inputs.results-publish-mode == 'pull-request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update security scan results"
          title: ${{ inputs.pr-title }}
          body: |
            Automated security scan results (summaries and SARIF only).

            Secret-scanner raw JSON is excluded from publish.
            See `${{ inputs.results-path }}/latest/summary.md`.
          branch: chore/security-results
          base: ${{ github.event.repository.default_branch || 'main' }}
          add-paths: ${{ inputs.results-path }}
          delete-branch: false

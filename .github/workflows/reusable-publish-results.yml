name: Reusable Publish Results

on:
  workflow_call:
    inputs:
      results-publish-mode:
        description: none | branch | pull-request
        type: string
        default: none
      results-branch:
        type: string
        default: security-results
      results-path:
        type: string
        default: security-results
      pr-title:
        type: string
        default: "chore: update security scan results"

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  publish:
    name: publish-results
    if: inputs.results-publish-mode == 'branch' || inputs.results-publish-mode == 'pull-request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
        continue-on-error: true
      - name: Aggregate
        uses: ./.github/actions/aggregate-results
        with:
          artifacts-dir: artifacts
          out-root: ${{ inputs.results-path }}
      - name: Commit to branch
        if: inputs.results-publish-mode == 'branch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ inputs.results-branch }}"
          git add "${{ inputs.results-path }}"
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: security results $(date -u +%Y-%m-%d)"
          git push -u origin "HEAD:${{ inputs.results-branch }}"
      - name: Create or update PR
        if: inputs.results-publish-mode == 'pull-request'
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7.0.6
        with:
          commit-message: "chore: update security scan results"
          title: ${{ inputs.pr-title }}
          body: |
            Automated security scan results.

            See `${{ inputs.results-path }}/latest/summary.md` for the summary.
            SARIF may also appear under the repository Security tab (Code Scanning).
          branch: chore/security-results
          base: ${{ github.event.repository.default_branch || 'main' }}
          add-paths: ${{ inputs.results-path }}
          delete-branch: false

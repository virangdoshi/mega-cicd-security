name: Reusable IaC Security

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      scan-scope:
        type: string
        default: full
      scope_iac:
        type: string
        default: "true"
      has_generic_code:
        type: string
        default: "true"
      has_terraform:
        type: string
        default: "true"
      has_k8s:
        type: string
        default: "true"
      has_cloudformation:
        type: string
        default: "true"
      conftest-policy-path:
        type: string
        default: ""
      enable-checkov:
        type: boolean
        default: true
      enable-kics:
        type: boolean
        default: true
      enable-trivy-config:
        type: boolean
        default: true
      enable-terrascan:
        type: boolean
        default: true
      enable-conftest:
        type: boolean
        default: true
      enable-kube-linter:
        type: boolean
        default: true
      enable-kubeconform:
        type: boolean
        default: true
      enable-kube-score:
        type: boolean
        default: true
      enable-kubescape:
        type: boolean
        default: true
      enable-cfn-guard:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  iac-checkov:
    name: iac-checkov
    if: inputs.enable-checkov && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true' || inputs.has_terraform == 'true' || inputs.has_k8s == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Checkov
        uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d # v12.3117.0
        with:
          directory: .
          output_format: sarif
          output_file_path: console,checkov.sarif
          soft_fail: ${{ inputs.fail-on-severity == 'NONE' }}
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: checkov.sarif
          category: iac-checkov
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-checkov-sarif
          path: checkov.sarif
          if-no-files-found: warn

  iac-kics:
    name: iac-kics
    if: inputs.enable-kics && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true' || inputs.has_terraform == 'true' || inputs.has_k8s == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: KICS
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          VERSION=2.1.20
          curl -sL "https://github.com/Checkmarx/kics/releases/download/v${VERSION}/kics_${VERSION}_linux_amd64.tar.gz" -o kics.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" kics.tgz 8a5aa375ccfdc0ddd1114eddf1f9638ad7f6122e98d12a592207509dbe6d81f8
          tar -xzf kics.tgz
          sudo install -m 0755 kics /usr/local/bin/kics
          kics scan -p . -o kics --report-formats sarif,json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: kics/results.sarif
          category: iac-kics
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kics
          path: kics
          if-no-files-found: warn

  iac-trivy-config:
    name: iac-trivy-config
    if: inputs.enable-trivy-config && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true' || inputs.has_terraform == 'true' || inputs.has_k8s == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: Install Trivy
        run: |
          set -euo pipefail
          VERSION=0.74.0
          curl -sL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" -o trivy.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" trivy.tgz 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          tar -xzf trivy.tgz
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Trivy config
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          SEV="$FAIL_ON_SEVERITY"
          ARGS=(config --format sarif --output trivy-config.sarif .)
          if [[ "$SEV" != "NONE" ]]; then
            ARGS+=(--exit-code 1 --severity-exit-code "$SEV")
          fi
          trivy "${ARGS[@]}" || { [[ "$SEV" == "NONE" ]] || exit 1; }
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: iac-trivy-config
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-trivy-config-sarif
          path: trivy-config.sarif
          if-no-files-found: warn

  iac-terrascan:
    name: iac-terrascan
    if: inputs.enable-terrascan && (inputs.selection-mode == 'all' || inputs.has_terraform == 'true' || inputs.has_k8s == 'true' || inputs.has_generic_code == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Terrascan
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/tenable/terrascan/releases/download/v1.19.9/terrascan_1.19.9_Linux_x86_64.tar.gz" -o terrascan.tgz
          tar -xzf terrascan.tgz terrascan
          ./terrascan scan -d . -o json > terrascan.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-terrascan-json
          path: terrascan.json
          if-no-files-found: warn

  iac-conftest:
    name: iac-conftest
    if: inputs.enable-conftest && inputs.conftest-policy-path != '' && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: Conftest
        env:
          CONFTEST_POLICY_PATH: ${{ inputs.conftest-policy-path }}
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz" -o conftest.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" conftest.tgz 620f41640d63bbde1646a108ce2816ba54c980466ceebb7e754dda2d508e8cd5
          tar -xzf conftest.tgz
          sudo install -m 0755 conftest /usr/local/bin/conftest
          conftest test . -p "$CONFTEST_POLICY_PATH" --output json | tee conftest.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-conftest-json
          path: conftest.json
          if-no-files-found: warn

  iac-kube-linter:
    name: iac-kube-linter
    if: inputs.enable-kube-linter && (inputs.selection-mode == 'all' || inputs.has_k8s == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: kube-linter
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/stackrox/kube-linter/releases/download/v0.7.1/kube-linter-linux.tar.gz" -o kl.tgz
          tar -xzf kl.tgz
          ./kube-linter lint . --format json > kube-linter.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kube-linter-json
          path: kube-linter.json
          if-no-files-found: warn

  iac-kubeconform:
    name: iac-kubeconform
    if: inputs.enable-kubeconform && (inputs.selection-mode == 'all' || inputs.has_k8s == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: kubeconform
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" -o kc.tgz
          tar -xzf kc.tgz
          mapfile -t YAMLS < <(find . -type f \( -name '*.yaml' -o -name '*.yml' \) ! -path './.git/*' | head -n 200)
          if [[ ${#YAMLS[@]} -eq 0 ]]; then
            echo "No YAML"; echo '[]' > kubeconform.json; exit 0
          fi
          ./kubeconform -summary -output json "${YAMLS[@]}" > kubeconform.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kubeconform-json
          path: kubeconform.json
          if-no-files-found: warn

  iac-kube-score:
    name: iac-kube-score
    if: inputs.enable-kube-score && (inputs.selection-mode == 'all' || inputs.has_k8s == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: kube-score
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/zegl/kube-score/releases/download/v1.19.0/kube-score_1.19.0_linux_amd64.tar.gz" -o ks.tgz
          tar -xzf ks.tgz
          mapfile -t YAMLS < <(find . -type f \( -name '*.yaml' -o -name '*.yml' \) ! -path './.git/*' | head -n 100)
          if [[ ${#YAMLS[@]} -eq 0 ]]; then
            echo "No YAML"; echo '[]' > kube-score.json; exit 0
          fi
          ./kube-score score --output-format json "${YAMLS[@]}" > kube-score.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kube-score-json
          path: kube-score.json
          if-no-files-found: warn

  iac-kubescape:
    name: iac-kubescape
    if: inputs.enable-kubescape && (inputs.selection-mode == 'all' || inputs.has_k8s == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: Kubescape
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/kubescape/kubescape/releases/download/v3.0.20/kubescape-ubuntu-latest" -o kubescape
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" kubescape dbd61f8e57092ada559f7e8d6fed9f6d928eca03c14c2fbebbbc656860ea432e
          sudo install -m 0755 kubescape /usr/local/bin/kubescape
          # Scan local manifests (frameworks: nsa, mitre, etc.)
          kubescape scan . --format json --output kubescape.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kubescape-json
          path: kubescape.json
          if-no-files-found: warn

  iac-cfn-guard:
    name: iac-cfn-guard
    if: inputs.enable-cfn-guard && (inputs.selection-mode == 'all' || inputs.has_cloudformation == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_iac == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Resolve scankit root
        id: scankit
        uses: virangdoshi/scankit/.github/actions/scankit-root@7f7c9aec76ecf3d17a3f78831caba9043b53d53a
      - name: cfn-guard
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.1.1/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz" -o cfn-guard.tgz
          bash "${{ steps.scankit.outputs.root }}/scripts/verify-sha256.sh" cfn-guard.tgz 68869b3600c62969e16242f6b06d591dcc548728850423ffbe6bfb945e9545a8
          tar -xzf cfn-guard.tgz
          CFN_BIN="$(find . -name 'cfn-guard' -type f -executable | head -1)"
          sudo install -m 0755 "$CFN_BIN" /usr/local/bin/cfn-guard
          mapfile -t TEMPLATES < <(find . -type f \( -iname '*template*.yml' -o -iname '*template*.yaml' -o -iname '*template*.json' -o -name 'cdk.out/**' \) ! -path './.git/*' | head -n 50)
          # Broader CFN cue files
          if [[ ${#TEMPLATES[@]} -eq 0 ]]; then
            mapfile -t TEMPLATES < <(find . -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) ! -path './.git/*' | head -n 30 | while read -r f; do grep -l -E 'AWSTemplateFormatVersion|Resources:' "$f" 2>/dev/null && echo "$f"; done)
          fi
          if [[ ${#TEMPLATES[@]} -eq 0 ]]; then
            echo "No CloudFormation templates; skip" | tee cfn-guard.txt
            exit 0
          fi
          # Validate structure without custom rules (parse check)
          : > cfn-guard.txt
          for t in "${TEMPLATES[@]}"; do
            echo "## $t" >> cfn-guard.txt
            cfn-guard validate "$t" >> cfn-guard.txt 2>&1 || true
          done
          if [[ "$FAIL_ON_SEVERITY" != "NONE" ]] && grep -qi 'FAILED\|error' cfn-guard.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-cfn-guard-txt
          path: cfn-guard.txt
          if-no-files-found: warn

name: Reusable IaC Security

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      has_generic_code:
        type: string
        default: "true"
      has_terraform:
        type: string
        default: "true"
      has_k8s:
        type: string
        default: "true"
      has_cloudformation:
        type: string
        default: "true"
      conftest-policy-path:
        type: string
        default: ""
      enable-checkov:
        type: boolean
        default: true
      enable-kics:
        type: boolean
        default: true
      enable-trivy-config:
        type: boolean
        default: true
      enable-terrascan:
        type: boolean
        default: true
      enable-conftest:
        type: boolean
        default: true
      enable-kube-linter:
        type: boolean
        default: true
      enable-kubeconform:
        type: boolean
        default: true
      enable-kube-score:
        type: boolean
        default: true
      enable-kubescape:
        type: boolean
        default: true
      enable-cfn-guard:
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  iac-checkov:
    name: iac-checkov
    if: inputs.enable-checkov && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true' || inputs.has_terraform == 'true' || inputs.has_k8s == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Checkov
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: .
          output_format: sarif
          output_file_path: console,checkov.sarif
          soft_fail: ${{ inputs.fail-on-severity == 'NONE' }}
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: checkov.sarif
          category: iac-checkov
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-checkov-sarif
          path: checkov.sarif
          if-no-files-found: warn

  iac-kics:
    name: iac-kics
    if: inputs.enable-kics && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true' || inputs.has_terraform == 'true' || inputs.has_k8s == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: KICS
        run: |
          set -euo pipefail
          curl -sL https://raw.githubusercontent.com/Checkmarx/kics/master/install.sh | bash
          export PATH="$HOME/.kics/bin:$PATH:/usr/local/bin"
          kics scan -p . -o kics --report-formats sarif,json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: kics/results.sarif
          category: iac-kics
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kics
          path: kics
          if-no-files-found: warn

  iac-trivy-config:
    name: iac-trivy-config
    if: inputs.enable-trivy-config && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true' || inputs.has_terraform == 'true' || inputs.has_k8s == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy config
        run: |
          SEV="${{ inputs.fail-on-severity }}"
          ARGS=(config --format sarif --output trivy-config.sarif .)
          if [[ "$SEV" != "NONE" ]]; then
            ARGS+=(--exit-code 1 --severity-exit-code "$SEV")
          fi
          trivy "${ARGS[@]}" || { [[ "$SEV" == "NONE" ]] || exit 1; }
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: iac-trivy-config
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-trivy-config-sarif
          path: trivy-config.sarif
          if-no-files-found: warn

  iac-terrascan:
    name: iac-terrascan
    if: inputs.enable-terrascan && (inputs.selection-mode == 'all' || inputs.has_terraform == 'true' || inputs.has_k8s == 'true' || inputs.has_generic_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Terrascan
        run: |
          set -euo pipefail
          curl -sL "$(curl -s https://api.github.com/repos/tenable/terrascan/releases/latest | grep -o 'https://.*/terrascan_[0-9.]*_Linux_x86_64.tar.gz')" -o terrascan.tgz
          tar -xzf terrascan.tgz terrascan
          ./terrascan scan -d . -o json > terrascan.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-terrascan-json
          path: terrascan.json
          if-no-files-found: warn

  iac-conftest:
    name: iac-conftest
    if: inputs.enable-conftest && inputs.conftest-policy-path != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Conftest
        run: |
          set -euo pipefail
          curl -sL https://raw.githubusercontent.com/open-policy-agent/conftest/master/install.sh | bash -s -- -b /usr/local/bin
          conftest test . -p "${{ inputs.conftest-policy-path }}" --output json | tee conftest.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-conftest-json
          path: conftest.json
          if-no-files-found: warn

  iac-kube-linter:
    name: iac-kube-linter
    if: inputs.enable-kube-linter && (inputs.selection-mode == 'all' || inputs.has_k8s == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: kube-linter
        run: |
          set -euo pipefail
          curl -sL "$(curl -s https://api.github.com/repos/stackrox/kube-linter/releases/latest | grep -o 'https://.*/kube-linter-linux.tar.gz')" -o kl.tgz
          tar -xzf kl.tgz
          ./kube-linter lint . --format json > kube-linter.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kube-linter-json
          path: kube-linter.json
          if-no-files-found: warn

  iac-kubeconform:
    name: iac-kubeconform
    if: inputs.enable-kubeconform && (inputs.selection-mode == 'all' || inputs.has_k8s == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: kubeconform
        run: |
          set -euo pipefail
          curl -sL "$(curl -s https://api.github.com/repos/yannh/kubeconform/releases/latest | grep -o 'https://.*/kubeconform-linux-amd64.tar.gz')" -o kc.tgz
          tar -xzf kc.tgz
          mapfile -t YAMLS < <(find . -type f \( -name '*.yaml' -o -name '*.yml' \) ! -path './.git/*' | head -n 200)
          if [[ ${#YAMLS[@]} -eq 0 ]]; then
            echo "No YAML"; echo '[]' > kubeconform.json; exit 0
          fi
          ./kubeconform -summary -output json "${YAMLS[@]}" > kubeconform.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kubeconform-json
          path: kubeconform.json
          if-no-files-found: warn

  iac-kube-score:
    name: iac-kube-score
    if: inputs.enable-kube-score && (inputs.selection-mode == 'all' || inputs.has_k8s == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: kube-score
        run: |
          set -euo pipefail
          curl -sL "$(curl -s https://api.github.com/repos/zegl/kube-score/releases/latest | grep -o 'https://.*/kube-score_[0-9.]*_linux_amd64.tar.gz')" -o ks.tgz
          tar -xzf ks.tgz
          mapfile -t YAMLS < <(find . -type f \( -name '*.yaml' -o -name '*.yml' \) ! -path './.git/*' | head -n 100)
          if [[ ${#YAMLS[@]} -eq 0 ]]; then
            echo "No YAML"; echo '[]' > kube-score.json; exit 0
          fi
          ./kube-score score --output-format json "${YAMLS[@]}" > kube-score.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kube-score-json
          path: kube-score.json
          if-no-files-found: warn

  iac-kubescape:
    name: iac-kubescape
    if: inputs.enable-kubescape && (inputs.selection-mode == 'all' || inputs.has_k8s == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Kubescape
        run: |
          set -euo pipefail
          curl -s https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash
          export PATH="$HOME/.kubescape:$PATH:/usr/local/bin"
          # Scan local manifests (frameworks: nsa, mitre, etc.)
          kubescape scan . --format json --output kubescape.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-kubescape-json
          path: kubescape.json
          if-no-files-found: warn

  iac-cfn-guard:
    name: iac-cfn-guard
    if: inputs.enable-cfn-guard && (inputs.selection-mode == 'all' || inputs.has_cloudformation == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: cfn-guard
        run: |
          set -euo pipefail
          curl -sL "$(curl -s https://api.github.com/repos/aws-cloudformation/cloudformation-guard/releases/latest | grep -o 'https://.*/cfn-guard-v[^"]*-x86_64-unknown-linux-gnu.tar.gz' | head -1)" -o cfn-guard.tgz || true
          if [[ ! -f cfn-guard.tgz ]] || [[ ! -s cfn-guard.tgz ]]; then
            cargo install cfn-guard 2>/dev/null || {
              curl https://sh.rustup.rs -sSf | sh -s -- -y
              # shellcheck disable=SC1091
              source "$HOME/.cargo/env"
              cargo install cfn-guard
            }
            export PATH="$HOME/.cargo/bin:$PATH"
          else
            tar -xzf cfn-guard.tgz
            export PATH="$PWD:$PATH"
            find . -name 'cfn-guard' -type f -executable | head -1 | xargs -I{} cp {} /usr/local/bin/cfn-guard || true
          fi
          mapfile -t TEMPLATES < <(find . -type f \( -iname '*template*.yml' -o -iname '*template*.yaml' -o -iname '*template*.json' -o -name 'cdk.out/**' \) ! -path './.git/*' | head -n 50)
          # Broader CFN cue files
          if [[ ${#TEMPLATES[@]} -eq 0 ]]; then
            mapfile -t TEMPLATES < <(find . -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) ! -path './.git/*' | head -n 30 | while read -r f; do grep -l -E 'AWSTemplateFormatVersion|Resources:' "$f" 2>/dev/null && echo "$f"; done)
          fi
          if [[ ${#TEMPLATES[@]} -eq 0 ]]; then
            echo "No CloudFormation templates; skip" | tee cfn-guard.txt
            exit 0
          fi
          # Validate structure without custom rules (parse check)
          : > cfn-guard.txt
          for t in "${TEMPLATES[@]}"; do
            echo "## $t" >> cfn-guard.txt
            cfn-guard validate "$t" >> cfn-guard.txt 2>&1 || true
          done
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" ]] && grep -qi 'FAILED\|error' cfn-guard.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iac-cfn-guard-txt
          path: cfn-guard.txt
          if-no-files-found: warn

name: Reusable Container Security

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      scan-scope:
        type: string
        default: full
      scope_container:
        type: string
        default: "true"
      scope_dockerfile:
        type: string
        default: "true"
      has_docker:
        type: string
        default: "true"
      image:
        description: Image ref to scan (optional)
        type: string
        default: ""
      dockerfile:
        description: Dockerfile path to build before scan
        type: string
        default: "Dockerfile"
      cosign-certificate-identity:
        type: string
        default: ""
      cosign-certificate-oidc-issuer:
        type: string
        default: ""
      enable-hadolint:
        type: boolean
        default: true
      enable-dockle:
        type: boolean
        default: true
      enable-trivy-image:
        type: boolean
        default: true
      enable-grype-image:
        type: boolean
        default: true
      enable-dive:
        type: boolean
        default: true
      enable-cosign-verify:
        type: boolean
        default: true
      enable-image-build:
        description: Allow docker build from Dockerfile (disable on untrusted PRs)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  container-hadolint:
    name: container-hadolint
    if: inputs.enable-hadolint && (inputs.selection-mode == 'all' || inputs.has_docker == 'true') && (inputs.scan-scope != 'diff' || inputs.scope_dockerfile == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          format: sarif
          output-file: hadolint.sarif
          failure-threshold: ${{ inputs.fail-on-severity == 'NONE' && 'error' || 'warning' }}
        continue-on-error: ${{ inputs.fail-on-severity == 'NONE' }}
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: container-hadolint
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-hadolint-sarif
          path: hadolint.sarif
          if-no-files-found: warn

  container-dockle:
    name: container-dockle
    if: inputs.enable-dockle && (inputs.selection-mode == 'all' || inputs.has_docker == 'true' || inputs.image != '') && (inputs.scan-scope != 'diff' || inputs.scope_container == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve image
        id: build
        env:
          IMAGE: ${{ inputs.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          ENABLE_IMAGE_BUILD: ${{ inputs.enable-image-build }}
        run: |
          set -euo pipefail
          IMG="$IMAGE"
          if [[ -z "$IMG" ]]; then
            if [[ "$ENABLE_IMAGE_BUILD" == "true" && -f "$DOCKERFILE" ]]; then
              IMG="local/security-scan:ci"
              docker build -f "$DOCKERFILE" -t "$IMG" .
            else
              echo "Skipping docker build (provide inputs.image or set enable-image-build: true)"
            fi
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
      - name: Dockle
        if: steps.build.outputs.image != ''
        env:
          FAIL_EXIT_CODE: ${{ inputs.fail-on-severity == 'NONE' && '0' || '1' }}
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          set -euo pipefail
          VERSION=v0.4.15
          curl -sL "https://github.com/goodwithtech/dockle/releases/download/${VERSION}/dockle_${VERSION#v}_Linux-64bit.tar.gz" -o dockle.tgz
          bash scripts/verify-sha256.sh dockle.tgz 8bfc9183d1d3d67800edb45bea4bb63ddf1d28bec5f89944075a07007d79caad
          tar -xzf dockle.tgz
          ./dockle --exit-code "$FAIL_EXIT_CODE" --format json --output dockle.json "${{ steps.build.outputs.image }}" || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "$FAIL_ON_SEVERITY" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-dockle-json
          path: dockle.json
          if-no-files-found: warn

  container-trivy-image:
    name: container-trivy-image
    if: inputs.enable-trivy-image && (inputs.selection-mode == 'all' || inputs.has_docker == 'true' || inputs.image != '') && (inputs.scan-scope != 'diff' || inputs.scope_container == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve image
        id: build
        env:
          IMAGE: ${{ inputs.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          ENABLE_IMAGE_BUILD: ${{ inputs.enable-image-build }}
        run: |
          set -euo pipefail
          IMG="$IMAGE"
          if [[ -z "$IMG" ]]; then
            if [[ "$ENABLE_IMAGE_BUILD" == "true" && -f "$DOCKERFILE" ]]; then
              IMG="local/security-scan:ci"
              docker build -f "$DOCKERFILE" -t "$IMG" .
            else
              echo "Skipping docker build (provide inputs.image or set enable-image-build: true)"
            fi
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
      - name: Install Trivy
        if: steps.build.outputs.image != ''
        run: |
          set -euo pipefail
          VERSION=0.74.0
          curl -sL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" -o trivy.tgz
          bash scripts/verify-sha256.sh trivy.tgz 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          tar -xzf trivy.tgz
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Trivy image
        if: steps.build.outputs.image != ''
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          SEV="$FAIL_ON_SEVERITY"
          ARGS=(image --format sarif --output trivy-image.sarif)
          if [[ "$SEV" != "NONE" ]]; then
            ARGS+=(--exit-code 1 --severity-exit-code "$SEV")
          fi
          ARGS+=("${{ steps.build.outputs.image }}")
          trivy "${ARGS[@]}" || { [[ "$SEV" == "NONE" ]] || exit 1; }
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && steps.build.outputs.image != ''
        with:
          sarif_file: trivy-image.sarif
          category: container-trivy-image
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: warn

  container-grype-image:
    name: container-grype-image
    if: inputs.enable-grype-image && (inputs.selection-mode == 'all' || inputs.has_docker == 'true' || inputs.image != '') && (inputs.scan-scope != 'diff' || inputs.scope_container == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve image
        id: build
        env:
          IMAGE: ${{ inputs.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          ENABLE_IMAGE_BUILD: ${{ inputs.enable-image-build }}
        run: |
          set -euo pipefail
          IMG="$IMAGE"
          if [[ -z "$IMG" ]]; then
            if [[ "$ENABLE_IMAGE_BUILD" == "true" && -f "$DOCKERFILE" ]]; then
              IMG="local/security-scan:ci"
              docker build -f "$DOCKERFILE" -t "$IMG" .
            else
              echo "Skipping docker build (provide inputs.image or set enable-image-build: true)"
            fi
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
      - name: Grype image
        if: steps.build.outputs.image != ''
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          image: ${{ steps.build.outputs.image }}
          fail-build: ${{ inputs.fail-on-severity != 'NONE' }}
          severity-cutoff: ${{ inputs.fail-on-severity == 'NONE' && 'negligible' || inputs.fail-on-severity }}
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: container-grype-image
        continue-on-error: true

  container-dive:
    name: container-dive
    if: inputs.enable-dive && (inputs.selection-mode == 'all' || inputs.has_docker == 'true' || inputs.image != '') && (inputs.scan-scope != 'diff' || inputs.scope_container == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve image
        id: build
        env:
          IMAGE: ${{ inputs.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          ENABLE_IMAGE_BUILD: ${{ inputs.enable-image-build }}
        run: |
          set -euo pipefail
          IMG="$IMAGE"
          if [[ -z "$IMG" ]]; then
            if [[ "$ENABLE_IMAGE_BUILD" == "true" && -f "$DOCKERFILE" ]]; then
              IMG="local/security-scan:ci"
              docker build -f "$DOCKERFILE" -t "$IMG" .
            else
              echo "Skipping docker build (provide inputs.image or set enable-image-build: true)"
            fi
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
      - name: Dive
        if: steps.build.outputs.image != ''
        run: |
          set -euo pipefail
          curl -sL "https://github.com/wagoodman/dive/releases/download/v0.12.0/dive_0.12.0_linux_amd64.tar.gz" -o dive.tgz
          bash scripts/verify-sha256.sh dive.tgz 20a7966523a0905f950c4fbf26471734420d6788cfffcd4a8c4bc972fded3e96
          tar -xzf dive.tgz
          CI=true ./dive "${{ steps.build.outputs.image }}" | tee dive.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-dive-txt
          path: dive.txt
          if-no-files-found: warn

  container-cosign-verify:
    name: container-cosign-verify
    if: inputs.enable-cosign-verify && inputs.image != '' && inputs.cosign-certificate-identity != '' && (inputs.scan-scope != 'diff' || inputs.scope_container == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify
        env:
          COSIGN_CERTIFICATE_IDENTITY: ${{ inputs.cosign-certificate-identity }}
          COSIGN_CERTIFICATE_OIDC_ISSUER: ${{ inputs.cosign-certificate-oidc-issuer || 'https://token.actions.githubusercontent.com' }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
            "$IMAGE" | tee cosign-verify.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: container-cosign-verify
          path: cosign-verify.txt
          if-no-files-found: warn

name: CI Self-Test

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run test suite
        run: ./tests/run.sh

  meta:
    needs: unit-tests
    uses: ./.github/workflows/reusable-meta.yml
    with:
      selection-mode: detected
      fail-on-severity: NONE
      has_actions: ${{ 'true' }}
      # Avoid failing CI when Code Scanning is not yet enabled on this library repo
      zizmor-advanced-security: false

  detect-smoke:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect ecosystems
        id: detect
        uses: ./.github/actions/detect-ecosystems
      - name: Show outputs
        run: |
          echo "has_actions=${{ steps.detect.outputs.has_actions }}"
          echo "has_shell=${{ steps.detect.outputs.has_shell }}"
          echo "has_generic_code=${{ steps.detect.outputs.has_generic_code }}"
          test -f ecosystems.json
          cat ecosystems.json

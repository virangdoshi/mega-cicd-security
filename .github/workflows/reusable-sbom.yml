name: Reusable SBOM

on:
  workflow_call:
    inputs:
      selection-mode:
        type: string
        default: detected
      fail-on-severity:
        type: string
        default: HIGH
      checkout-ref:
        type: string
        default: ""
      has_generic_code:
        type: string
        default: "true"
      enable-syft:
        type: boolean
        default: true
      enable-trivy-sbom:
        type: boolean
        default: true
      enable-cdxgen:
        type: boolean
        default: true
      enable-grype-sbom:
        type: boolean
        default: true
      enable-scancode:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sbom-syft:
    name: sbom-syft
    if: inputs.enable-syft && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Syft SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: syft.spdx.json
      - name: Syft CycloneDX
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: syft.cdx.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-syft
          path: |
            syft.spdx.json
            syft.cdx.json

  sbom-trivy:
    name: sbom-trivy
    if: inputs.enable-trivy-sbom && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy SBOM
        run: |
          trivy fs --format spdx-json --output trivy.spdx.json .
          trivy fs --format cyclonedx --output trivy.cdx.json .
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-trivy
          path: |
            trivy.spdx.json
            trivy.cdx.json

  sbom-cdxgen:
    name: sbom-cdxgen
    if: inputs.enable-cdxgen && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: cdxgen
        run: |
          npx --yes @cyclonedx/cdxgen -r -o cdxgen.cdx.json || true
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-cdxgen
          path: cdxgen.cdx.json
          if-no-files-found: warn

  sbom-grype-consume:
    name: sbom-grype-consume
    if: inputs.enable-grype-sbom && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true')
    needs: [sbom-syft]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-syft
          path: sbom
      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Grype SBOM
        run: |
          set -euo pipefail
          grype "sbom:sbom/syft.cdx.json" -o json > grype-sbom.json || EXIT=$?
          EXIT=${EXIT:-0}
          if [[ "${{ inputs.fail-on-severity }}" != "NONE" && "$EXIT" -ne 0 ]]; then
            exit "$EXIT"
          fi
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: sbom-grype-json
          path: grype-sbom.json
          if-no-files-found: warn

  sbom-scancode:
    name: sbom-scancode
    if: inputs.enable-scancode && (inputs.selection-mode == 'all' || inputs.has_generic_code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: ScanCode
        run: |
          set -euo pipefail
          pip install scancode-toolkit
          scancode -clipeu --json-pp scancode.json . || true
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: sbom-scancode-json
          path: scancode.json
          if-no-files-found: warn
